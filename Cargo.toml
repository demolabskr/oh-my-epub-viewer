[package]
name = "nsh-app-epub-viewer"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.3.0"
nsh-base = "0.3.0"
env_logger = "0.11"
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.21.2"
base64 = "0.23.1"
serde_json = "1.0.154"
percent-encoding = "2.3.2"
log = "0.4.34"
rfd = "0.17.2"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.3.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.3.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.3.0", default-features = false }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
